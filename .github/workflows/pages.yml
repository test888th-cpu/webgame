name: Deploy web client (GitHub Pages)

# Publishes the exact web-build artifact that a successful CI run on main
# produced; nothing is rebuilt here. Disabled until a maintainer sets the
# repository variable PAGES_DEPLOY_ENABLED=true and selects
# "GitHub Actions" as the Pages source (see DEPLOYMENT.md).
#
# GitHub Pages hosts only the static browser client. It is not a game server.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run ID whose web-build artifact to deploy (rollback)"
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: site
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the artifact before publishing
        working-directory: site
        run: |
          for f in index.html index.js index.wasm index.pck index.audio.worklet.js BUILD_MANIFEST.txt; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          sed -n '/^files:/,$p' BUILD_MANIFEST.txt | tail -n +2 | sha256sum -c --quiet
          cat BUILD_MANIFEST.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

  verify:
    # Plays the published site over HTTPS: boot, movement and combat.
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tools/web-smoke/package-lock.json') }}
      - name: Smoke test the live site
        working-directory: tools/web-smoke
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium
          # Pages can take a few seconds to serve a new deployment everywhere.
          for attempt in 1 2 3; do
            if node smoke.ts "--url=$PAGE_URL" --screenshot=../../live-screenshot.png; then exit 0; fi
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-screenshot
          path: live-screenshot.png
          retention-days: 14
          if-no-files-found: ignore
