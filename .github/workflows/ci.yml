name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_DIR: ${{ github.workspace }}/.godot-bin

jobs:
  repo-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/ci/check-repo.sh

  gdscript-lint:
    name: GDScript lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install gdtoolkit==4.5.0
      - name: gdlint
        working-directory: client
        run: gdlint .
      - name: gdformat --check
        working-directory: client
        run: gdformat --check .

  assets:
    name: Asset manifest, sheets, licences and pipeline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r tools/assets/requirements.txt
      - name: Pipeline unit tests
        run: python3 -m unittest tools/assets/test_pipeline.py -v
      - name: Validate every asset (files, frames, transparency, licences, SpriteFrames up to date)
        run: python3 tools/assets/validate.py

  godot-tests:
    name: Godot project opens and tests pass
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-editor-${{ hashFiles('tools/ci/install-godot.sh') }}
      - run: tools/ci/install-godot.sh "$GODOT_DIR"
      - name: Import project (fails on script or resource errors)
        run: |
          set -o pipefail
          "$GODOT_DIR/godot" --headless --path client --import 2>&1 | tee import.log
          if grep -E "^(SCRIPT )?ERROR" import.log; then exit 1; fi
      - name: Unit tests
        run: '"$GODOT_DIR/godot" --headless --path client --script res://tests/TestRunner.gd'

  backend:
    name: Backend typecheck, tests and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci-only-password@localhost:5432/postgres
      DATABASE_URL: postgres://ci:ci-only-password@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Migration check on a fresh database
        run: |
          npm run migrate
          npm run migrate -- --check
      - name: API starts and becomes ready
        run: |
          API_PORT=8080 node src/main.ts &
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/readyz; then exit 0; fi
            sleep 1
          done
          echo "API did not become ready"; exit 1

  backend-image:
    name: Backend image build, container scan and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: docker build -t ironbound-api:ci backend
      - name: Image runs as non-root on the pinned Node.js, without build tools
        run: |
          test "$(docker run --rm ironbound-api:ci id -u)" != "0"
          test "$(docker run --rm ironbound-api:ci node -v)" = "v$(cat .nvmrc)"
          if docker run --rm ironbound-api:ci sh -c 'command -v npm || command -v npx'; then
            echo "npm/npx must not be present in the runtime image"; exit 1
          fi
      - name: Install Trivy 0.76.1
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v0.76.1
          curl -fsSL --retry 3 -o trivy.tgz "$base/trivy_0.76.1_Linux-64bit.tar.gz"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tgz" | sha256sum -c
          tar -xzf trivy.tgz trivy
      - name: Scan image (fail on fixable high/critical)
        run: ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress ironbound-api:ci
      - name: SBOM (CycloneDX) for the API's npm dependencies
        working-directory: backend
        # npm sbom reads the installed tree, so install from the lockfile first.
        run: |
          npm ci --no-audit --no-fund
          npm sbom --omit=dev --sbom-format=cyclonedx > ../sbom-api.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom-api.cdx.json
          retention-days: 90

  web-export:
    name: Web export and browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [godot-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GODOT_DIR }}
            ~/.local/share/godot/export_templates
          key: godot-web-${{ hashFiles('tools/ci/install-godot.sh') }}
      - run: tools/ci/install-godot.sh "$GODOT_DIR" --with-web-templates
      - name: Export
        run: |
          "$GODOT_DIR/godot" --headless --path client --import
          mkdir -p build/web
          "$GODOT_DIR/godot" --headless --path client --export-release "Web" ../build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck
          ls -la build/web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/web-smoke/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tools/web-smoke/package-lock.json') }}
      - name: Smoke test in headless Chromium
        working-directory: tools/web-smoke
        # Only the headless shell, without --with-deps: the runner image already
        # has the shared libraries, and --with-deps pulls optional fonts from apt
        # mirrors that have taken over 10 minutes.
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium
          node smoke.ts ../../build/web --screenshot=../../smoke-screenshot.png
      - name: Record build manifest
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "godot: $("$GODOT_DIR/godot" --version)"
            echo "preset: Web (release, single-threaded, GL Compatibility)"
            echo "files:"
            (cd build/web && sha256sum *)
          } > "$RUNNER_TEMP/BUILD_MANIFEST.txt"
          mv "$RUNNER_TEMP/BUILD_MANIFEST.txt" build/web/
          cat build/web/BUILD_MANIFEST.txt
      # The exact files that pages.yml deploys; the name is looked up there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: build/web
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-screenshot
          path: smoke-screenshot.png
          retention-days: 14
          if-no-files-found: ignore
