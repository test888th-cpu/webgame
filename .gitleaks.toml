# Gitleaks configuration: the default rules, plus one narrow allowlist.
#
# The reference registries record the SHA-256 of every World of ClaudeCraft source
# file they were built from, in their `inputs` field (`source.inputs` in four files,
# the manifest's top-level `inputs`):  "src/<path>.ts": "<64 lowercase hex>".
# A file name containing "discord" (discord-api-token) or "api", "auth", "key",
# "token" (generic-api-key) next to 64 hex characters looks like a credential to
# those two rules. All 265 findings in the repository's history were verified to be
# such lines, each value equal to the SHA-256 of that file at the pinned reference
# commit d2b91e0884cb269422c28d0b42d2a30a01de130a (see THIRD_PARTY_NOTICES.md).
#
# Scope, all three required at once (condition AND):
#   * only the discord-api-token and generic-api-key rules;
#   * only the five registry files below, by exact path;
#   * only a whole line that is a "src/....ts" key with a 64-hex value.
# Everything else stays scanned. Gitleaks cannot see JSON nesting, so
# tools/ci/check_registry_hash_lines.py fails CI if a line of that shape ever
# appears in these files outside `inputs`, and tools/ci/test-gitleaks-allowlist.sh
# proves real-looking tokens are still found (CI: .github/workflows/security.yml).

[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 hashes of pinned reference source files in the registries' inputs field"
targetRules = ["discord-api-token", "generic-api-key"]
condition = "AND"
paths = [
  '''^data/registry/reference_(items|loot_entries|loot_tables|monsters|registry_manifest)\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"src/[A-Za-z0-9_./-]+\.ts": "[0-9a-f]{64}",?$''',
]
